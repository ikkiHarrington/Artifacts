  <g transform="rotate(-90 32 32)" fill="none" stroke-width="10">
    <circle cx="32" cy="32" r="17" pathLength="100" stroke="#ffffff" stroke-dasharray="55 45"/>
    <circle cx="32" cy="32" r="17" pathLength="100" stroke="#f0904f" stroke-dasharray="27 73" stroke-dashoffset="-57"/>
    <circle cx="32" cy="32" r="17" pathLength="100" stroke="#a9c0f0" stroke-dasharray="14 86" stroke-dashoffset="-86"/>
  </g>
</svg>
